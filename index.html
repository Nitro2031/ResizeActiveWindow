    <body>
        <div id="btn">
            <table>
                <thead>
                    <tr>
                        <th>Width × Height</th>
                        <th>
                            <button id="settings"> ⚙ Settings</button>
                        </th>
                    </tr>
                </thead>
                <tbody id="presets"> </tbody>
            </table>
        </div>
        <div id="settingsPanel" style="display:none;">
            <table>
                <thead>
                    <tr>
                        <th>Width × Height</th>
                        <th>
                            <button id="back"> ✔ Enter</button>
                        </th>
                    </tr>
                </thead>
                <tbody id="presetList"></tbody>
                <tfoot>
                    <form id="presetForm">
                        <tr>
                            <td style="white-space: nowrap;">
                                <input id="newWidth" type="number" size="5" placeholder="Width">
                                ×
                                <input id="newHeight" type="number" size="5" placeholder="Height">
                            </td>
                            <td>
                                <button id="addPreset"> ⊕ Add</button>
                            </td>
                        </tr>
                    </form>
                </tfoot>
            </table>
        </div>
        <hr />
        <table>
            <thead>
                <tr>
                    <th>System</th>
                    <th>Position</th>
                    <th>Size</th>
                </tr>
            </thead>
            <tbody id="displaySize"></tbody>
            <tfoot>
                <tr>
                    <td>Window</td>
                    <td>
                        <span id="currentPosition"> - × - </span>
                    </td>
                    <td>
                        <span id="currentSize"> - × - </span>
                    </td>
                </tr>
            </tfoot>
        </table>
        <div id="testText"></div>
        <div id="moveButtons" style="display: block;">
            <div id="top">
                <button id="moveTopLeft" title="TopLeft">↖</button>
                <button id="moveTop" title="Top">↑</button>
                <button id="moveTopRight" title="TopRight">↗</button>
            </div>
            <div id="middle">
                <button id="moveLeft" title="Left">←</button>
                <button id="moveCenter" title="Center">◎</button>
                <button id="moveRight" title="Right">→</button>
            </div>
            <div id="bottom">
                <button id="moveBottomLeft" title="BottomLeft">↙</button>
                <button id="moveBottom" title="Bottom">↓</button>
                <button id="moveBottomRight" title="BottomRight">↘</button>
            </div>
        </div>
        <div id="version" style="display: none;"></div>

        <script src="presets.js"></script>
        <script src="windowInfo.js"></script>
        <script src="ui.js"></script>
        <script src="popup.js"></script>
    </body>

</html>
